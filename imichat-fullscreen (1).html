<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; width: 100vw; overflow: hidden; background: #f0f4f8;
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

    #fullscreen-chat {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; display: none; z-index: 99999;
    }

    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f0f4f8; z-index: 99998; transition: opacity 0.4s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0; border-top-color: #005cde;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 0.95rem; color: #56627c; font-weight: 500; }
    .loading-sub  { font-size: 0.8rem; color: #99a0b0; margin-top: 0.4rem; }

    #error-screen {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f0f4f8; z-index: 99997;
    }
    .error-icon  { font-size: 2.5rem; margin-bottom: 1rem; }
    .error-title { font-size: 1rem; font-weight: 600; color: #56627c; margin-bottom: 0.5rem; }
    .error-msg   { font-size: 0.8rem; color: #99a0b0; max-width: 320px; text-align: center; margin-bottom: 1.5rem; }
    .retry-btn   {
      padding: 0.6rem 1.5rem; background: #005cde; color: white;
      border: none; border-radius: 6px; font-size: 0.875rem;
      cursor: pointer; font-family: inherit;
    }
    .retry-btn:hover { background: #0049b5; }

    #debug-log {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); color: #48bb78;
      font-family: monospace; font-size: 11px;
      padding: 8px 12px; max-height: 140px; overflow-y: auto;
      z-index: 999999; display: none;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Connecting to chat...</div>
    <div class="loading-sub" id="loading-sub">Please wait a moment</div>
  </div>

  <div id="error-screen">
    <div class="error-icon">💬</div>
    <div class="error-title">Chat Unavailable</div>
    <div class="error-msg" id="error-msg">Unable to connect to the chat service. Please try again.</div>
    <button class="retry-btn" onclick="init()">Try Again</button>
  </div>

  <iframe id="fullscreen-chat" allow="microphone; camera"></iframe>
  <div id="debug-log"></div>

  <!-- imi.chat anchor — hidden, needed for widget loader fallback -->
  <div id="divicw"
    data-bind="62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F"
    data-org=""
    data-guid="d7fd391b-e954-4075-ba96-81714ebfb1ff"
    style="display:none;">
  </div>

  <script>
    // Credentials decoded from working cURL
    var CLIENT_ID     = 'ee72e71b-a79a-4f51-83d7-097aca89d306';
    var CLIENT_SECRET = '62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F';
    var DATA_BIND     = '62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F';
    var TOKEN_URL     = 'https://chat-widget.imi.chat/oauth/token';
    var CLIENT_HOST   = window.location.hostname;

    function log(msg) {
      var el = document.getElementById('debug-log');
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toISOString().substr(11,8) + '] ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function setStatus(text, sub) {
      document.getElementById('loading-text').textContent = text;
      if (sub) document.getElementById('loading-sub').textContent = sub;
    }

    function showError(msg) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-screen').style.display = 'flex';
    }

    function showChat(url) {
      log('Loading chat URL: ' + url);
      var frame = document.getElementById('fullscreen-chat');
      frame.src = url;
      frame.style.display = 'block';
      frame.addEventListener('load', function() {
        var ls = document.getElementById('loading-screen');
        ls.classList.add('fade-out');
        setTimeout(function() { ls.style.display = 'none'; }, 400);
      });
    }

    // Watch DOM for iframe injected by widget
    function watchForIframe() {
      var observer = new MutationObserver(function(mutations) {
        for (var m = 0; m < mutations.length; m++) {
          var nodes = mutations[m].addedNodes;
          for (var n = 0; n < nodes.length; n++) {
            var node = nodes[n];
            if (node.tagName === 'IFRAME' && node.id !== 'fullscreen-chat') {
              handleIframe(node); observer.disconnect(); return;
            }
            if (node.querySelectorAll) {
              var frames = node.querySelectorAll('iframe:not(#fullscreen-chat)');
              if (frames.length > 0) { handleIframe(frames[0]); observer.disconnect(); return; }
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Polling fallback
      var poll = setInterval(function() {
        var frames = document.querySelectorAll('iframe:not(#fullscreen-chat)');
        if (frames.length > 0) { clearInterval(poll); observer.disconnect(); handleIframe(frames[0]); }
      }, 300);
    }

    function handleIframe(iframe) {
      log('Widget iframe detected, hiding bubble');
      iframe.style.cssText = 'display:none!important;';
      var src = iframe.src;
      if (src && src !== 'about:blank') {
        log('iframe src: ' + src);
        showChat(src);
      } else {
        var w = setInterval(function() {
          if (iframe.src && iframe.src !== 'about:blank') {
            clearInterval(w);
            log('Deferred iframe src: ' + iframe.src);
            showChat(iframe.src);
          }
        }, 100);
      }
    }

    async function init() {
      document.getElementById('error-screen').style.display = 'none';
      document.getElementById('loading-screen').style.display = 'flex';
      document.getElementById('fullscreen-chat').style.display = 'none';
      setStatus('Connecting to chat...', 'Please wait a moment');

      var basicAuth = btoa(CLIENT_ID + ':' + CLIENT_SECRET);
      log('Requesting OAuth token with correct client_id...');

      try {
        var resp = await fetch(TOKEN_URL, {
          method: 'POST',
          headers: {
            'authorization': 'Basic ' + basicAuth,
            'content-type': 'application/json',
            'grant_type': 'client_credentials',
            'client_host': CLIENT_HOST,
            'accept': '*/*'
          }
          // No body — content-length: 0 like the working request
        });

        log('Token response: ' + resp.status);

        if (resp.ok) {
          var data = await resp.json();
          log('Token keys: ' + JSON.stringify(Object.keys(data)));
          var token = data.access_token || data.token || data.id_token;
          log('Got token: ' + (token ? token.substr(0,20) + '...' : 'none'));
          setStatus('Loading chat...', 'Almost there');
          // Now start the widget loader — it should succeed with correct credentials
          watchForIframe();
          loadWidgetScript();
        } else {
          var err = await resp.text();
          log('Token error: ' + err);
          // Fall back to widget loader anyway — it does its own retry logic
          log('Falling back to widget loader...');
          watchForIframe();
          loadWidgetScript();
        }

      } catch(err) {
        log('Fetch error: ' + err.message + ' — trying widget loader');
        watchForIframe();
        loadWidgetScript();
      }
    }

    function loadWidgetScript() {
      setStatus('Loading chat...', 'Starting widget');
      var e = document.getElementById('divicw');
      var s = document.createElement('script');
      s.src = 'https://media.imi.chat/widget/js/imichatinit.js?t=' + new Date().toISOString();
      e.insertAdjacentElement('afterend', s);
      s.addEventListener('load', function() {
        log('imichatinit.js loaded successfully');
      });
      s.addEventListener('error', function() {
        log('imichatinit.js failed to load');
        showError('Unable to load chat widget. Please try again.');
      });
    }

    // Press D to toggle debug log
    document.addEventListener('keydown', function(e) {
      if (e.key === 'd' || e.key === 'D') {
        var el = document.getElementById('debug-log');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    });

    init();
  </script>

</body>
</html>
