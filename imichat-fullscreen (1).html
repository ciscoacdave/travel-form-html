<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; width: 100vw; overflow: hidden; background: #f0f4f8;
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f0f4f8; z-index: 99990; transition: opacity 0.4s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    #loading-screen.gone { display: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0; border-top-color: #005cde;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.95rem; color: #56627c; font-weight: 500; }
    .loading-sub  { font-size: 0.8rem; color: #99a0b0; margin-top: 0.4rem; }

    /* Hide bubble and unread badge */
    #imi-chatbutton,
    #chatunread-frame,
    #imichat-fullscreen-modal,
    .chatbutton,
    .chatunread-frame {
      display: none !important;
      visibility: hidden !important;
    }

    /* Force the main chat container and iframe to be fullscreen */
    #divchatmain,
    .main-chat-cont {
      display: block !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 99995 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .main-chat-cont-sub {
      width: 100% !important;
      height: 100% !important;
    }

    #iframechatwindow,
    .chatwindow-frame {
      display: block !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 99995 !important;
    }

    #debug-log {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); color: #48bb78;
      font-family: monospace; font-size: 11px;
      padding: 8px 12px; max-height: 180px; overflow-y: auto;
      z-index: 999999; display: none;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Connecting to chat...</div>
    <div class="loading-sub" id="loading-sub">Please wait a moment</div>
  </div>

  <div id="debug-log"></div>

  <!-- imi.chat anchor — widget injects everything inside here -->
  <div id="divicw"
    data-bind="62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F"
    data-org=""
    data-guid="d7fd391b-e954-4075-ba96-81714ebfb1ff">
  </div>

  <script>
    var CLIENT_ID     = 'ee72e71b-a79a-4f51-83d7-097aca89d306';
    var CLIENT_SECRET = '62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F';
    var TOKEN_URL     = 'https://chat-widget.imi.chat/oauth/token';
    var CLIENT_HOST   = window.location.hostname;

    function log(msg) {
      var el = document.getElementById('debug-log');
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toISOString().substr(11,8) + '] ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function hideLoader() {
      var ls = document.getElementById('loading-screen');
      ls.classList.add('fade-out');
      setTimeout(function() { ls.classList.add('gone'); }, 400);
    }

    // Watch for iframechatwindow to have a src and be ready
    function watchForChatReady() {
      var checked = false;
      var poll = setInterval(function() {
        var frame = document.getElementById('iframechatwindow');
        if (!frame) return;
        var src = frame.src;
        if (src && src !== 'about:blank') {
          if (!checked) {
            checked = true;
            log('iframechatwindow src: ' + src.substr(0, 80));
          }
          // Hide loader once iframe has loaded content
          frame.onload = function() {
            log('iframechatwindow loaded');
            clearInterval(poll);
            setTimeout(hideLoader, 1500); // give widget 1.5s to render
          };
          // Fallback — hide loader after 4s regardless
          setTimeout(function() {
            clearInterval(poll);
            hideLoader();
          }, 4000);
        }
      }, 200);
    }

    async function init() {
      document.getElementById('loading-text').textContent = 'Authenticating...';
      document.getElementById('loading-sub').textContent  = 'Contacting chat service';

      var basicAuth = btoa(CLIENT_ID + ':' + CLIENT_SECRET);
      log('Requesting OAuth token...');

      try {
        var resp = await fetch(TOKEN_URL, {
          method: 'POST',
          headers: {
            'authorization': 'Basic ' + basicAuth,
            'content-type': 'application/json',
            'grant_type': 'client_credentials',
            'client_host': CLIENT_HOST,
            'accept': '*/*'
          }
        });
        log('Token: ' + resp.status);
        if (resp.ok) {
          var data = await resp.json();
          log('Got token: ' + (data.access_token || '').substr(0, 20) + '...');
        } else {
          log('Token error: ' + await resp.text());
        }
      } catch(e) {
        log('Token fetch error: ' + e.message);
      }

      document.getElementById('loading-text').textContent = 'Loading chat...';
      document.getElementById('loading-sub').textContent  = 'Starting widget';

      watchForChatReady();
      loadWidgetScript();
    }

    function loadWidgetScript() {
      var e = document.getElementById('divicw');
      var s = document.createElement('script');
      s.src = 'https://media.imi.chat/widget/js/imichatinit.js?t=' + new Date().toISOString();
      e.insertAdjacentElement('afterend', s);
      s.addEventListener('load',  function() { log('imichatinit.js loaded'); });
      s.addEventListener('error', function() { log('imichatinit.js failed'); });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'd' || e.key === 'D') {
        var el = document.getElementById('debug-log');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    });

    init();
  </script>

</body>
</html>
