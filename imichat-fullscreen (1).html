<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; width: 100vw; overflow: hidden; background: #f0f4f8;
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

    #fullscreen-chat {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; display: none; z-index: 99999;
    }

    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f0f4f8; z-index: 99998; transition: opacity 0.4s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0; border-top-color: #005cde;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 0.95rem; color: #56627c; font-weight: 500; }
    .loading-sub  { font-size: 0.8rem; color: #99a0b0; margin-top: 0.4rem; }

    #error-screen {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f0f4f8; z-index: 99997;
    }
    .error-icon  { font-size: 2.5rem; margin-bottom: 1rem; }
    .error-title { font-size: 1rem; font-weight: 600; color: #56627c; margin-bottom: 0.5rem; }
    .error-msg   { font-size: 0.8rem; color: #99a0b0; max-width: 320px; text-align: center; margin-bottom: 1.5rem; }
    .retry-btn   {
      padding: 0.6rem 1.5rem; background: #005cde; color: white;
      border: none; border-radius: 6px; font-size: 0.875rem;
      cursor: pointer; font-family: inherit;
    }
    .retry-btn:hover { background: #0049b5; }

    #debug-log {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); color: #48bb78;
      font-family: monospace; font-size: 11px;
      padding: 8px 12px; max-height: 180px; overflow-y: auto;
      z-index: 999999; display: none;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Connecting to chat...</div>
    <div class="loading-sub" id="loading-sub">Please wait a moment</div>
  </div>

  <div id="error-screen">
    <div class="error-icon">💬</div>
    <div class="error-title">Chat Unavailable</div>
    <div class="error-msg" id="error-msg">Unable to connect to the chat service.</div>
    <button class="retry-btn" onclick="init()">Try Again</button>
  </div>

  <iframe id="fullscreen-chat" allow="microphone; camera"></iframe>
  <div id="debug-log"></div>

  <div id="divicw"
    data-bind="62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F"
    data-org=""
    data-guid="d7fd391b-e954-4075-ba96-81714ebfb1ff"
    style="display:none;">
  </div>

  <script>
    var CLIENT_ID     = 'ee72e71b-a79a-4f51-83d7-097aca89d306';
    var CLIENT_SECRET = '62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F';
    var TOKEN_URL     = 'https://chat-widget.imi.chat/oauth/token';
    var CLIENT_HOST   = window.location.hostname;
    var chatLaunched  = false; // guard so we only launch once

    function log(msg) {
      var el = document.getElementById('debug-log');
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toISOString().substr(11,8) + '] ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function setStatus(text, sub) {
      document.getElementById('loading-text').textContent = text;
      if (sub) document.getElementById('loading-sub').textContent = sub;
    }

    function showError(msg) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('error-screen').style.display = 'flex';
    }

    function showChat(url) {
      if (chatLaunched) { log('showChat called again, ignoring: ' + url); return; }
      chatLaunched = true;
      log('Redirecting to chat: ' + url);
      // Redirect the whole page rather than embedding in an iframe
      // This avoids the document.domain cross-origin blocking issue
      window.location.href = url;
    }

    function watchIframeSrc(iframe, label) {
      log('[' + label + '] id=' + (iframe.id||'none') + ' src=' + (iframe.src||'blank'));

      // If src is already set and valid, use it
      if (iframe.src && iframe.src !== 'about:blank' && iframe.src !== '') {
        // Skip the bubble iframe (small fixed position ones)
        if (isChatIframe(iframe)) {
          showChat(iframe.src);
        } else {
          log('[' + label + '] Skipping bubble iframe');
          iframe.style.cssText = 'display:none!important;';
        }
        return;
      }

      // Watch for src to be set via attribute mutation
      var attrObserver = new MutationObserver(function(mutations) {
        for (var m = 0; m < mutations.length; m++) {
          if (mutations[m].attributeName === 'src') {
            var newSrc = iframe.src;
            log('[' + label + '] src changed to: ' + newSrc);
            if (newSrc && newSrc !== 'about:blank') {
              attrObserver.disconnect();
              if (isChatIframe(iframe)) {
                showChat(newSrc);
              } else {
                log('[' + label + '] Skipping bubble iframe after src set');
                iframe.style.cssText = 'display:none!important;';
              }
            }
          }
        }
      });
      attrObserver.observe(iframe, { attributes: true });

      // Also poll as fallback
      var poll = setInterval(function() {
        if (iframe.src && iframe.src !== 'about:blank') {
          clearInterval(poll);
          attrObserver.disconnect();
          log('[' + label + '] Polled src: ' + iframe.src);
          if (isChatIframe(iframe)) {
            showChat(iframe.src);
          } else {
            log('[' + label + '] Skipping bubble iframe (poll)');
            iframe.style.cssText = 'display:none!important;';
          }
        }
      }, 100);

      // Give up after 10s
      setTimeout(function() {
        clearInterval(poll);
        attrObserver.disconnect();
        log('[' + label + '] Gave up waiting for src');
      }, 10000);
    }

    // Determine if this is the real chat iframe vs the bubble launcher
    function isChatIframe(iframe) {
      var src = iframe.src || '';
      var id  = iframe.id  || '';
      // Exclude the TLS alert fallback iframe
      if (id === 'tls_al_frm') return false;
      // The chat iframe will have a token or widget path in the src
      if (src.indexOf('token') > -1)  return true;
      if (src.indexOf('widget') > -1) return true;
      if (src.indexOf('chat') > -1)   return true;
      // If src is blank, watch it — could be either
      if (!src || src === 'about:blank') return true;
      return false;
    }

    var iframeCount = 0;
    function watchForIframes() {
      var observer = new MutationObserver(function(mutations) {
        for (var m = 0; m < mutations.length; m++) {
          var nodes = mutations[m].addedNodes;
          for (var n = 0; n < nodes.length; n++) {
            var node = nodes[n];
            if (node.tagName === 'IFRAME' && node.id !== 'fullscreen-chat') {
              iframeCount++;
              watchIframeSrc(node, 'iframe-' + iframeCount);
            }
            if (node.querySelectorAll) {
              var frames = node.querySelectorAll('iframe:not(#fullscreen-chat)');
              frames.forEach(function(f) {
                iframeCount++;
                watchIframeSrc(f, 'iframe-' + iframeCount);
              });
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    }

    async function init() {
      chatLaunched = false;
      iframeCount  = 0;
      document.getElementById('error-screen').style.display = 'none';
      document.getElementById('loading-screen').style.display = 'flex';
      document.getElementById('fullscreen-chat').style.display = 'none';
      setStatus('Connecting to chat...', 'Please wait a moment');

      var basicAuth = btoa(CLIENT_ID + ':' + CLIENT_SECRET);
      log('Requesting OAuth token...');

      try {
        var resp = await fetch(TOKEN_URL, {
          method: 'POST',
          headers: {
            'authorization': 'Basic ' + basicAuth,
            'content-type': 'application/json',
            'grant_type': 'client_credentials',
            'client_host': CLIENT_HOST,
            'accept': '*/*'
          }
        });

        log('Token response: ' + resp.status);

        if (resp.ok) {
          var data = await resp.json();
          log('Token: ' + (data.access_token || '').substr(0,20) + '...');
        } else {
          log('Token error: ' + await resp.text());
        }

      } catch(err) {
        log('Token fetch error: ' + err.message);
      }

      // Start watching for iframes before loading the script
      watchForIframes();
      loadWidgetScript();
    }

    function loadWidgetScript() {
      setStatus('Loading chat...', 'Starting widget');
      var e = document.getElementById('divicw');
      // Remove any previously injected script
      var old = document.getElementById('imi-script');
      if (old) old.remove();
      var s = document.createElement('script');
      s.id  = 'imi-script';
      s.src = 'https://media.imi.chat/widget/js/imichatinit.js?t=' + new Date().toISOString();
      e.insertAdjacentElement('afterend', s);
      s.addEventListener('load',  function() { log('imichatinit.js loaded'); });
      s.addEventListener('error', function() { log('imichatinit.js failed'); showError('Unable to load chat widget.'); });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'd' || e.key === 'D') {
        var el = document.getElementById('debug-log');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    });

    init();
  </script>

</body>
</html>
