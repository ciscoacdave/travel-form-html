<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; width: 100vw; overflow: hidden; background: #f0f4f8;
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f0f4f8; z-index: 99990; transition: opacity 0.4s ease;
      pointer-events: none; /* let clicks pass through to the widget */
    }
    #loading-screen.fade-out { opacity: 0; }
    #loading-screen.gone { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0; border-top-color: #005cde;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.95rem; color: #56627c; font-weight: 500; }
    .loading-sub  { font-size: 0.8rem; color: #99a0b0; margin-top: 0.4rem; }

    /* Force the chat window iframe to fill the screen */
    #iframechatwindow {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      border-radius: 0 !important;
      z-index: 99995 !important;
    }

    /* Hide the bubble button and unread badge */
    #imi-chatbutton,
    #chatunread-frame,
    #imichat-fullscreen-modal {
      display: none !important;
      visibility: hidden !important;
    }

    #debug-log {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); color: #48bb78;
      font-family: monospace; font-size: 11px;
      padding: 8px 12px; max-height: 180px; overflow-y: auto;
      z-index: 999999; display: none;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Connecting to chat...</div>
    <div class="loading-sub" id="loading-sub">Please wait a moment</div>
  </div>

  <div id="debug-log"></div>

  <!-- imi.chat anchor -->
  <div id="divicw"
    data-bind="62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F"
    data-org=""
    data-guid="d7fd391b-e954-4075-ba96-81714ebfb1ff">
  </div>

  <script>
    var CLIENT_ID     = 'ee72e71b-a79a-4f51-83d7-097aca89d306';
    var CLIENT_SECRET = '62A7138C-F6AA-4B69-8FC5-317D0E8AEB8F';
    var TOKEN_URL     = 'https://chat-widget.imi.chat/oauth/token';
    var CLIENT_HOST   = window.location.hostname;
    var bubbleClicked = false;

    function log(msg) {
      var el = document.getElementById('debug-log');
      var line = document.createElement('div');
      line.textContent = '[' + new Date().toISOString().substr(11,8) + '] ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    function setStatus(text, sub) {
      document.getElementById('loading-text').textContent = text;
      if (sub) document.getElementById('loading-sub').textContent = sub;
    }

    function hideLoader() {
      var ls = document.getElementById('loading-screen');
      ls.classList.add('fade-out');
      setTimeout(function() { ls.classList.add('gone'); }, 400);
    }

    // Try to click the chat bubble button
    function clickBubble() {
      if (bubbleClicked) return;

      // Try the known bubble iframe id
      var bubbleFrame = document.getElementById('imi-chatbutton');
      if (bubbleFrame) {
        log('Found bubble iframe, attempting click');
        try {
          var btn = bubbleFrame.contentDocument
                 && bubbleFrame.contentDocument.querySelector('button, [role="button"], div[onclick], #chatBtn, .chat-btn');
          if (btn) {
            log('Clicking button inside bubble iframe');
            btn.click();
            bubbleClicked = true;
            return;
          }
        } catch(e) {
          log('Cannot access bubble iframe content (cross-origin): ' + e.message);
        }

        // Cross-origin — simulate a click on the iframe element itself
        log('Simulating click on bubble iframe element');
        var rect = bubbleFrame.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        ['mousedown','mouseup','click'].forEach(function(type) {
          bubbleFrame.dispatchEvent(new MouseEvent(type, {
            bubbles: true, cancelable: true, clientX: cx, clientY: cy
          }));
        });
        bubbleClicked = true;
        return;
      }

      // Try any element with imi in id/class
      var candidates = document.querySelectorAll('[id*="imi"], [class*="imi"], [id*="chat-btn"], [id*="chatBtn"]');
      for (var i = 0; i < candidates.length; i++) {
        var el = candidates[i];
        if (el.id !== 'divicw' && el.id !== 'debug-log') {
          log('Clicking candidate: ' + el.id + ' / ' + el.className);
          el.click();
          bubbleClicked = true;
          return;
        }
      }

      log('Bubble not found yet, retrying...');
    }

    // Watch for the chat window iframe to appear and go fullscreen
    function watchForChatWindow() {
      var observer = new MutationObserver(function(mutations) {
        for (var m = 0; m < mutations.length; m++) {
          var nodes = mutations[m].addedNodes;
          for (var n = 0; n < nodes.length; n++) {
            var node = nodes[n];
            checkNode(node);
            if (node.querySelectorAll) {
              node.querySelectorAll('iframe').forEach(checkNode);
            }
          }
          // Also watch for style/attribute changes on existing iframes
          if (mutations[m].type === 'attributes') {
            checkNode(mutations[m].target);
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
    }

    function checkNode(node) {
      if (!node || node.tagName !== 'IFRAME') return;
      var id = node.id || '';

      // Hide bubble and unread badge
      if (id === 'imi-chatbutton' || id === 'chatunread-frame' || id === 'imichat-fullscreen-modal') {
        node.style.cssText = 'display:none!important;visibility:hidden!important;';

        // Once bubble is ready, click it after a short delay
        if (id === 'imi-chatbutton' && !bubbleClicked) {
          log('Bubble iframe appeared, scheduling click...');
          setStatus('Starting chat...', 'Almost ready');
          setTimeout(function() {
            clickBubble();
            // Poll for chat window after click
            var attempts = 0;
            var poll = setInterval(function() {
              attempts++;
              var chatFrame = document.getElementById('iframechatwindow');
              if (chatFrame) {
                clearInterval(poll);
                log('Chat window appeared after click');
                expandChatWindow(chatFrame);
              }
              if (attempts > 30) { clearInterval(poll); log('Gave up waiting for chat window'); }
            }, 300);
          }, 1500);
        }
        return;
      }

      // The main chat window
      if (id === 'iframechatwindow') {
        log('iframechatwindow detected');
        expandChatWindow(node);
      }
    }

    function expandChatWindow(frame) {
      log('Expanding chat window to fullscreen');
      frame.style.cssText = [
        'position:fixed!important',
        'top:0!important',
        'left:0!important',
        'width:100%!important',
        'height:100%!important',
        'max-width:100%!important',
        'max-height:100%!important',
        'border-radius:0!important',
        'border:none!important',
        'z-index:99995!important',
        'display:block!important'
      ].join(';');
      hideLoader();
    }

    async function init() {
      setStatus('Authenticating...', 'Contacting chat service');
      var basicAuth = btoa(CLIENT_ID + ':' + CLIENT_SECRET);
      log('Requesting OAuth token...');

      try {
        var resp = await fetch(TOKEN_URL, {
          method: 'POST',
          headers: {
            'authorization': 'Basic ' + basicAuth,
            'content-type': 'application/json',
            'grant_type': 'client_credentials',
            'client_host': CLIENT_HOST,
            'accept': '*/*'
          }
        });
        log('Token: ' + resp.status);
        if (resp.ok) {
          var data = await resp.json();
          log('Got token: ' + (data.access_token||'').substr(0,20) + '...');
        }
      } catch(e) {
        log('Token fetch: ' + e.message);
      }

      setStatus('Loading chat...', 'Starting widget');
      watchForChatWindow();
      loadWidgetScript();
    }

    function loadWidgetScript() {
      var old = document.getElementById('imi-script');
      if (old) old.remove();
      var e = document.getElementById('divicw');
      var s = document.createElement('script');
      s.id  = 'imi-script';
      s.src = 'https://media.imi.chat/widget/js/imichatinit.js?t=' + new Date().toISOString();
      e.insertAdjacentElement('afterend', s);
      s.addEventListener('load',  function() { log('imichatinit.js loaded'); });
      s.addEventListener('error', function() { log('imichatinit.js failed'); });
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'd' || e.key === 'D') {
        var el = document.getElementById('debug-log');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    });

    init();
  </script>

</body>
</html>
